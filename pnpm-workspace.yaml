shamefullyHoist: true

updateConfig:
  ignoreDependencies:
    - '@types/node'

peerDependencyRules:
  allowedVersions:
    '@prettier/plugin-oxc': '0.2'
    typescript: '6'

allowedDeprecatedVersions:
  '@humanwhocodes/config-array': '0.13.0'
  '@humanwhocodes/object-schema': '2.0.3'
  '@ungap/structured-clone': '1.2.0'
  eslint: '8.57.1'
  eslint-plugin-markdown: '3 || 5'
  glob: '7 || 10'
  inflight: '1.0.6'
  jsox: '1.2.123'
  rimraf: '3.0.2'

allowBuilds:
  core-js-pure: false
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - tsx@4.23.13
